<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>temp convertor</title>
</head>
<body>
    <div class="container">
        <div class="convertor-container">
            <div class="head">
                <h1 id="title">Fahrenheit To Celsius</h1>
                <button id="changer">↔️</button>
            </div>
            <div class="convertor">
                <input type="text" id="temp-input">
                <button id="convert">convert</button>
                <p id="output"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
