<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <nav class="navigation">
            <aside class="nav-side">
                <div class="logo">Logo</div>
                <ul class="nav-item">
                    <li class="active">weather</li>
                    <li>cities</li>
                    <li>map</li>
                </ul>
                <p class="exit-icon">Exit</p>
            </aside>
        </nav>
        <main class="content">
            <div class="search-section">
                <input type="text" id="search-city" placeholder="search by city">
            </div>
            <div class="weather-details">
                <p id="city-name">London</p>
                <p id="city-temp">28°C</p>
                <p id="city-humadity">Humidity: 65%</p>
            </div>
        </main>
        <aside class="summary">
            <ul>
                <li>
                    <p>today(sunday)</p>
                    <p>sun</p>
                    <p>32</p>
                </li>
                <li>
                    <p>monday</p>
                    <p>rainy</p>
                    <p>28</p>
                </li>
                <li>
                    <p>tuesday</p>
                    <p>cloudy</p>
                    <p>30</p>
                </li>
                <li>
                    <p>wednsday</p>
                    <p>sun</p>
                    <p>30</p>
                </li>
                <li>
                    <p>today</p>
                    <p>cloudy</p>
                    <p>27</p>
                </li>
            </ul>
        </aside>
    </div>


    <script src="app.js"></script>
</body>
</html>
